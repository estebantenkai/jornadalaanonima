<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jornada · Orden de habilidades · La Anónima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  --bg:#FFF8FB;--surface:#FFFFFF;--surface2:#F8EEF4;--text:#12172B;--muted:#585E7E;--line:#E4D8E0;--hdr:#FFFFFF;
  --pink:#F0287F;--accent:#D61C6B;--on-pink:#12172B;--teal:#127F76;--amber:#C48A00;
  --body:'Montserrat','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --title:'Fjalla One','Arial Narrow','Helvetica Neue',Impact,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1022;--surface:#151A33;--surface2:#1C2243;--text:#F4F6FF;--muted:#AEB6D8;--line:#2A3158;--hdr:#0A0D1D;--accent:#FF4B93;--teal:#36D1C1;--amber:#FFC24D}
}
:root[data-theme="dark"]{--bg:#0C1022;--surface:#151A33;--surface2:#1C2243;--text:#F4F6FF;--muted:#AEB6D8;--line:#2A3158;--hdr:#0A0D1D;--accent:#FF4B93;--teal:#36D1C1;--amber:#FFC24D}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:60}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* Cabecera */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);border-bottom:1px solid var(--line)}
.hdr-in{margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.client{display:flex;align-items:center;background:#fff;border:1px solid #E4D8E0;border-radius:8px;padding:4px 10px;height:38px;flex-shrink:0}
.client img{height:26px;width:auto;display:block}
.brand-div{width:1px;height:24px;background:var(--line)}
.lz svg{height:30px;width:auto;display:block}
.lz-ink{fill:var(--text)}
.hdr-r{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;line-height:1.3}

/* Participante */
h1,h2{font-family:var(--title);font-weight:400;text-transform:uppercase;line-height:1.06;letter-spacing:.01em}
.p-top{padding:22px 0 6px}
.p-top h1{font-size:clamp(32px,9vw,44px);margin-bottom:8px}
.p-top p{font-size:15px;color:var(--muted);line-height:1.65}
.p-top p b{color:var(--text)}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}
.sec h2{font-size:21px}
.sec .cnt{font-size:13px;font-weight:800;color:var(--accent)}
.mini{display:flex;gap:8px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;min-height:38px}
.ghost:disabled{opacity:.35}
.tray{display:flex;flex-direction:column;gap:8px}
.tray-empty{border:2px dashed var(--line);border-radius:12px;padding:18px;font-size:14px;color:var(--muted);text-align:center}
.ord{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pink);border-radius:12px;padding:8px 8px 8px 10px;min-height:56px}
.ord .no{font-family:var(--title);font-size:24px;color:var(--accent);text-align:center;line-height:1}
.ord .nm{font-size:14px;font-weight:700;line-height:1.3}
.mv{display:flex;gap:4px}
.ib{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center}
.ib:disabled{opacity:.25}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pool{display:flex;flex-direction:column;gap:8px}
.pc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;font-weight:600;line-height:1.35;min-height:54px;transition:border-color .12s,transform .12s}
.pc:active{transform:scale(.985);border-color:var(--pink)}
.pool-done{font-size:14px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.spacer{height:110px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--hdr);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar-in .n{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar-in .n b{color:var(--text);font-size:18px;font-family:var(--title);font-weight:400}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;background:var(--pink);color:var(--on-pink);border:none;border-radius:10px;font-size:15px;font-weight:800;min-height:52px}
.btn:disabled{opacity:.4}
.btn-g{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;background:transparent;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:700;min-height:50px}
.done{text-align:center;padding:50px 0 40px}
.done .ic{width:76px;height:76px;border-radius:50%;background:var(--teal);color:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done .ic svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done h1{font-size:36px;margin-bottom:10px}
.done p{font-size:15.5px;color:var(--muted);max-width:380px;margin:0 auto 22px}
.testnote{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);background:var(--text);color:var(--bg);font-size:13px;font-weight:700;padding:12px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:all .22s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Panel de Lina: presentación en pantalla completa */
body.panel{overflow:hidden;background:#0C1022}
.panel .hdr,.panel .toast{display:none}
.deck{position:fixed;inset:0;background:#0C1022;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:center center;color:#F4F6FF}
.dk-logos{position:absolute;left:60px;top:30px;display:flex;align-items:center;gap:22px}
.dk-logos .client{height:76px;padding:6px 16px;border-radius:12px}
.dk-logos .client img{height:56px}
.dk-logos .brand-div{height:46px}
.dk-logos .lz svg{height:68px}
.dk-title{position:absolute;left:0;right:0;top:112px;text-align:center;pointer-events:none}
.dk-title h1{font-size:56px;line-height:1.05}
.dk-title p{font-size:25px;color:#AEB6D8;margin-top:6px}
.dk-qrbox{position:absolute;left:680px;top:240px;width:560px;height:560px;background:#fff;border-radius:28px;padding:28px}
.dk-qrbox svg{display:block;width:100%;height:100%}
.dk-url{position:absolute;left:0;right:0;top:822px;text-align:center;font-size:30px;font-weight:600;color:#AEB6D8}
.dk-count{position:absolute;left:0;right:0;top:884px;text-align:center;font-size:40px;color:#F4F6FF}
.dk-count b{font-family:var(--title);font-weight:400;font-size:64px;color:#FF4B93;margin-right:10px;vertical-align:-6px}
.dk-order{position:absolute;left:90px;right:90px;top:262px;bottom:72px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:16px 40px}
.dk-order .it{display:flex;align-items:center;gap:30px;background:#151A33;border:1px solid #2A3158;border-radius:20px;padding:0 34px}
.dk-order .no{font-family:var(--title);font-size:84px;line-height:1;color:#FF4B93;min-width:92px;text-align:center}
.dk-order .nm{font-size:36px;font-weight:700;line-height:1.25}
.dk-dots{position:absolute;left:60px;right:60px;top:232px}
.dk-dots svg{display:block;width:100%;height:auto}
.dk-wait{text-align:center;padding-top:200px;color:#AEB6D8;font-size:30px}
.dk-wait b{display:block;font-family:var(--title);font-weight:400;font-size:64px;color:#F4F6FF;text-transform:uppercase;margin-bottom:10px}
.dk-prog{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:14px;pointer-events:none}
.dk-prog i{width:14px;height:14px;border-radius:50%;background:#2A3158}
.dk-prog i.on{background:#FF4B93}
.dk-live{position:absolute;right:36px;bottom:24px;display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;color:#AEB6D8}
.dk-live i{width:14px;height:14px;border-radius:50%;background:#36D1C1}
.dk-live.off i{background:#FF4B93}
.dk-hint{position:absolute;left:60px;bottom:22px;font-size:20px;color:#AEB6D8;opacity:.7}
.dk-start{position:absolute;inset:0;background:#0C1022;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:5}
.dk-start button{background:#F0287F;color:#12172B;border:none;border-radius:16px;padding:26px 54px;font-size:30px;font-weight:800}
.dk-start p{font-size:18px;color:#AEB6D8;max-width:480px;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

$('hdrR').innerHTML='Jornada del<br>'+esc(CFG.fecha);

/* =====================================================
   VISTA DEL PARTICIPANTE (celular)
   ===================================================== */
var UP='<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',DOWN='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',XI='<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>';
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var LSK='lz_jornada_'+J,P={id:'',seed:1,order:[],sent:false},sending=false;
function saveP(){if(DEMO)return;try{localStorage.setItem(LSK,JSON.stringify(P));}catch(e){}}
function loadP(){
  try{var d=JSON.parse(localStorage.getItem(LSK));if(d&&d.id){P=d;return;}}catch(e){}
  P={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),seed:Math.floor(Math.random()*2147483000)+1,order:[],sent:false};saveP();
}
function pool(){
  var a=SK.map(function(s){return s.id;}),x=P.seed;
  for(var i=a.length-1;i>0;i--){x=(x*48271)%2147483647;var j=x%(i+1),t=a[i];a[i]=a[j];a[j]=t;}
  return a.filter(function(id){return P.order.indexOf(id)<0;});
}
function viewPart(){
  if(P.sent)return viewDone();
  var n=P.order.length,pl=pool();
  var poolH=pl.length?pl.map(function(id){return '<button type="button" class="pc" data-a="add" data-id="'+id+'">'+esc(name(id))+'</button>';}).join(''):'<div class="pool-done">Ubicaste las 10. Si querés cambiar algo, usá las flechas de tu orden.</div>';
  var tray=n?P.order.map(function(id,i){
    return '<div class="ord"><span class="no">'+(i+1)+'</span><span class="nm">'+esc(name(id))+'</span><span class="mv">'
     +'<button type="button" class="ib" data-a="up" data-i="'+i+'" aria-label="Subir"'+(i===0?' disabled':'')+'>'+UP+'</button>'
     +'<button type="button" class="ib" data-a="down" data-i="'+i+'" aria-label="Bajar"'+(i===n-1?' disabled':'')+'>'+DOWN+'</button>'
     +'<button type="button" class="ib" data-a="out" data-i="'+i+'" aria-label="Sacar de mi orden">'+XI+'</button></span></div>';
  }).join(''):'<div class="tray-empty">Todavía no ubicaste ninguna. Tocá una habilidad de arriba para ponerla en el puesto 1.</div>';
  return '<div class="wrap"><div class="p-top"><h1>Ordená las 10 habilidades</h1><p>¿Cómo creés que las ordenó el <b>Foro Económico Mundial</b>? La <b>1</b> es la más importante. Tocalas en orden: la primera que toques queda en el puesto 1.</p></div>'
   +'<div class="sec"><h2>Por ordenar</h2><span class="cnt">'+pl.length+' restantes</span></div><div class="pool">'+poolH+'</div>'
   +'<div class="sec"><h2>Tu orden</h2><div class="mini"><button type="button" class="ghost" data-a="undo"'+(n?'':' disabled')+'>Deshacer</button><button type="button" class="ghost" data-a="reset"'+(n?'':' disabled')+'>Empezar de nuevo</button></div></div><div class="tray">'+tray+'</div>'
   +'<div class="spacer"></div></div>'
   +'<div class="bar"><div class="bar-in"><span class="n"><b>'+n+'</b> de 10</span><button type="button" class="btn" data-a="send"'+(n===10&&!sending?'':' disabled')+'>'+(sending?'Enviando...':'Enviar mi orden')+'</button></div></div>';
}
function viewDone(){
  var test=(!CFG.endpoint&&!DEMO)?'<p class="testnote">Modo de prueba: esta herramienta todavía no está conectada a la planilla y no envió nada.</p>':'';
  return '<div class="wrap"><div class="done"><div class="ic">'+CHECK+'</div><h1>Tu orden quedó registrado</h1><p>Mirá la pantalla: en un momento vemos cómo se distribuyó el grupo y qué orden puso el Foro.</p>'+test+'<button type="button" class="btn-g" data-a="edit">Cambiar mi orden</button></div></div>';
}
function renderPart(keep){var y=window.pageYOffset;$('app').innerHTML=viewPart();if(keep){window.scrollTo(0,y);}else{window.scrollTo(0,0);}}
function sendRanking(cb){
  if(DEMO||!CFG.endpoint){cb('skip');return;}
  try{
    fetch(CFG.endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CFG.token,tipo:'ranking',jornada:J,id:P.id,orden:P.order})})
      .then(function(){cb('ok');},function(){cb('err');});
  }catch(e){cb('err');}
}
function actPart(a,el){
  var i=+(el.getAttribute('data-i')||0),id=+(el.getAttribute('data-id')||0),n=P.order.length;
  if(a==='add'){P.order.push(id);saveP();renderPart(true);toast('Puesto '+P.order.length+': '+name(id));return;}
  if(a==='up'&&i>0){var t=P.order[i];P.order[i]=P.order[i-1];P.order[i-1]=t;}
  else if(a==='down'&&i<n-1){var u=P.order[i];P.order[i]=P.order[i+1];P.order[i+1]=u;}
  else if(a==='out'){P.order.splice(i,1);}
  else if(a==='undo'){P.order.pop();}
  else if(a==='reset'){P.order=[];}
  else if(a==='edit'){P.sent=false;saveP();renderPart();return;}
  else if(a==='send'){
    if(P.order.length!==10||sending)return;
    sending=true;renderPart(true);
    sendRanking(function(r){
      sending=false;
      if(r==='err'){toast('No pudimos enviar. Revisá tu conexión y probá de nuevo.');renderPart(true);return;}
      P.sent=true;saveP();renderPart();
    });
    return;
  }
  saveP();renderPart(true);
}

/* =====================================================
   PANEL DE LINA: presentación de tres pantallas
   1) código QR  2) orden del Foro  3) puntos del grupo
   ===================================================== */
var D={resps:[]},slide=0,started=false,busy=false,simTimer=null,live={ok:false,msg:'Conectando...'};
var C={text:'#F4F6FF',mut:'#AEB6D8',line:'#2A3158',pink:'#FF4B93',teal:'#36D1C1'};
var qrSvg='';

function jit(i,id){var x=Math.sin(i*12.9898+id*78.233)*43758.5453;return (x-Math.floor(x))*2-1;}
function wrapTxt(s,max){var w=s.split(' '),l=[],cur='';w.forEach(function(x){if((cur+' '+x).trim().length>max&&cur){l.push(cur);cur=x;}else{cur=(cur+' '+x).trim();}});if(cur)l.push(cur);return l;}

function participantUrl(){
  var base=location.origin==='null'?location.href.split('?')[0].split('#')[0]:location.origin+location.pathname;
  return base+(J!==CFG.jornada?'?j='+encodeURIComponent(J):'');
}
function makeQr(){
  try{var qr=qrcode(0,'M');qr.addData(participantUrl());qr.make();qrSvg=qr.createSvgTag({cellSize:8,margin:0,scalable:true});}
  catch(e){qrSvg='<p style="color:#12172B;font-size:28px">No se pudo generar el código.</p>';}
}

function logosHtml(){var b=document.querySelector('.hdr .brand');return '<div class="dk-logos">'+(b?b.innerHTML:'')+'</div>';}

function slideQr(){
  var n=D.resps.length;
  return logosHtml()+'<div class="dk-title"><h1>Escaneá y ordená las 10 habilidades</h1></div>'
   +'<div class="dk-qrbox">'+qrSvg+'</div>'
   +'<p class="dk-url">'+esc(participantUrl().replace(/^https?:\/\//,''))+'</p>'
   +'<p class="dk-count"><b>'+n+'</b> '+(n===1?'persona ya respondió':'personas ya respondieron')+'</p>';
}
function slideOrder(){
  var items=SK.map(function(s){return '<div class="it"><span class="no">'+s.id+'</span><span class="nm">'+esc(s.n)+'</span></div>';}).join('');
  return logosHtml()+'<div class="dk-title"><h1>El orden del Foro Económico Mundial</h1><p>De la habilidad más importante a la menos importante</p></div><div class="dk-order">'+items+'</div>';
}
function slideDots(){
  var n=D.resps.length,pos={},hit={};
  SK.forEach(function(s){pos[s.id]=[];hit[s.id]=0;});
  D.resps.forEach(function(o,i){o.forEach(function(id,p){if(pos[id]){pos[id].push({p:p+1,i:i});if(p+1===id)hit[id]++;}});});
  var PX0=600,PX1=1560,CW=(PX1-PX0)/10,RH=68,TOP=62,H=TOP+RH*10+6,g='';
  function px(p){return PX0+(p-0.5)*CW;}
  g+='<text x="'+PX0+'" y="14" font-size="21" font-weight="700" fill="'+C.mut+'">Más importante</text><text x="'+PX1+'" y="14" text-anchor="end" font-size="21" font-weight="700" fill="'+C.mut+'">Menos importante</text><text x="1700" y="14" text-anchor="middle" font-size="21" font-weight="700" fill="'+C.mut+'">Acertaron</text>';
  for(var p=1;p<=10;p++)g+='<text x="'+px(p)+'" y="46" text-anchor="middle" font-size="26" font-weight="800" fill="'+C.text+'">'+p+'</text>';
  SK.forEach(function(s,i){
    var y0=TOP+i*RH,yC=y0+RH/2;
    if(i%2===0)g+='<rect x="0" y="'+y0+'" width="1800" height="'+RH+'" rx="10" fill="rgba(255,255,255,.04)"/>';
    for(var q=0;q<=10;q++)g+='<line x1="'+(PX0+q*CW)+'" y1="'+(y0+8)+'" x2="'+(PX0+q*CW)+'" y2="'+(y0+RH-8)+'" stroke="'+C.line+'" stroke-width="1.5"/>';
    g+='<circle cx="38" cy="'+yC+'" r="24" fill="rgba(255,75,147,.16)" stroke="'+C.pink+'" stroke-width="2"/><text x="38" y="'+(yC+9)+'" text-anchor="middle" font-size="24" font-weight="800" fill="'+C.pink+'">'+s.id+'</text>';
    var ls=wrapTxt(s.n,33);
    ls.forEach(function(t,k){g+='<text x="82" y="'+(yC+(ls.length===1?9:(k===0?-3:23)))+'" font-size="25" font-weight="700" fill="'+C.text+'">'+esc(t)+'</text>';});
    pos[s.id].forEach(function(d){
      var cx=px(d.p)+jit(d.i,s.id)*CW*0.28,cy=yC+jit(d.i+101,s.id+7)*RH*0.22;
      g+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="11.5" fill="'+C.pink+'" fill-opacity=".8" stroke="#0C1022" stroke-width="2"/>';
    });
    g+='<circle cx="'+px(s.id)+'" cy="'+yC+'" r="25" fill="none" stroke="'+C.teal+'" stroke-width="5"/>';
    if(n)g+='<text x="1700" y="'+(yC+13)+'" text-anchor="middle" font-size="40" font-weight="800" fill="'+C.text+'">'+Math.round(hit[s.id]/n*100)+'%</text>';
  });
  var body=n?'<svg viewBox="0 0 1800 '+H+'" role="img" aria-label="Cómo ordenó el grupo cada habilidad">'+g+'</svg>':'<div class="dk-wait"><b>Esperando respuestas</b><span>Volvé al código QR para que las personas empiecen.</span></div>';
  return logosHtml()+'<div class="dk-title"><h1>Así ordenó el grupo</h1><p>Cada punto es una persona. El círculo verde marca el puesto del Foro.</p></div><div class="dk-dots">'+body+'</div>';
}

function render(){
  var st=$('stage');if(!st)return;
  var h=slide===0?slideQr():slide===1?slideOrder():slideDots();
  var dots='<div class="dk-prog">'+[0,1,2].map(function(i){return '<i class="'+(i===slide?'on':'')+'"></i>';}).join('')+'</div>';
  var ls='<div class="dk-live'+(live.ok?'':' off')+'"><i></i>'+(live.ok?'':'<span>'+esc(live.msg)+'</span>')+'</div>';
  st.innerHTML=h+dots+ls+(slide===0?'<p class="dk-hint">Clic o flechas para avanzar</p>':'');
}
function setLive(ok,txt){live={ok:ok,msg:txt};render();}
function go(d){var n=Math.max(0,Math.min(2,slide+d));if(n!==slide){slide=n;render();}}
function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080),st=$('stage');if(st)st.style.transform='scale('+s+')';}
function fs(){
  var d=document.documentElement;
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){var f=d.requestFullscreen||d.webkitRequestFullscreen;if(f){var r=f.call(d);if(r&&r.catch)r.catch(function(){});}}
    else{var x=document.exitFullscreen||document.webkitExitFullscreen;if(x){var r2=x.call(document);if(r2&&r2.catch)r2.catch(function(){});}}
  }catch(e){}
}
function start(){started=true;var s=$('dkStart');if(s)s.style.display='none';fs();fit();render();}

/* datos de ejemplo (?demo=1): se ven con ?panel=cualquiera&demo=1 */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var demoRand=rng(20261211),SPREAD=[1.2,2.0,2.4,2.1,2.8,3.0,2.2,3.6,2.6,3.0];
function gauss(){var u=demoRand()||1e-9,v=demoRand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function demoResp(){var sc=SK.map(function(s,i){return {id:s.id,v:s.id+gauss()*SPREAD[i]};});sc.sort(function(a,b){return a.v-b.v;});return sc.map(function(x){return x.id;});}
function seedDemo(){D.resps=[];for(var i=0;i<14;i++)D.resps.push(demoResp());}
function simulate(){
  if(simTimer){clearInterval(simTimer);simTimer=null;return;}
  simTimer=setInterval(function(){if(D.resps.length>=30){clearInterval(simTimer);simTimer=null;return;}D.resps.push(demoResp());render();},900);
}

/* lectura de la planilla */
function jsonp(url,ok,fail){
  var cb='__jr'+Date.now(),s=document.createElement('script'),done=false;
  window[cb]=function(d){done=true;cleanup();ok(d);};
  function cleanup(){try{delete window[cb];}catch(e){window[cb]=undefined;}if(s.parentNode)s.parentNode.removeChild(s);}
  s.onerror=function(){if(!done){cleanup();fail();}};
  s.src=url+'&callback='+cb;document.head.appendChild(s);
  setTimeout(function(){if(!done){cleanup();fail();}},9000);
}
function gotData(d){
  busy=false;
  if(!d||!d.ok){setLive(false,d&&d.error==='clave'?'La clave del panel no es correcta':'La planilla no respondió bien');return;}
  D.resps=(d.respuestas||[]).map(function(r){return r.orden;});
  setLive(true,'');
}
function poll(){
  if(DEMO){if(!D.resps.length){seedDemo();}setLive(true,'');return;}
  if(!CFG.endpoint){setLive(false,'Falta conectar la planilla');return;}
  if(busy)return;busy=true;
  var url=CFG.endpoint+'?accion=ranking&jornada='+encodeURIComponent(J)+'&clave='+encodeURIComponent(CLAVE)+'&t='+Date.now();
  var failAll=function(){busy=false;setLive(false,'Sin conexión con la planilla');};
  fetch(url,{cache:'no-store'}).then(function(r){return r.json();}).then(gotData).catch(function(){jsonp(url,gotData,failAll);});
}

function renderPanel(){
  document.documentElement.setAttribute('data-theme','dark');
  document.body.classList.add('panel');
  makeQr();
  $('app').innerHTML='<div class="deck" id="deck"><div class="stage" id="stage"></div><div class="dk-start" id="dkStart"><button type="button" id="dkGo">Iniciar presentación</button><p>Se abre en pantalla completa. Avanzá con un clic o con las flechas del teclado.</p></div></div>';
  fit();render();poll();setInterval(poll,4000);
  window.addEventListener('resize',fit);
}

document.addEventListener('click',function(e){
  if(PANEL){
    if(e.target&&e.target.id==='dkGo'){start();return;}
    if(started)go(e.shiftKey?-1:1);
    return;
  }
  var el=e.target.closest?e.target.closest('[data-a]'):null;
  if(el)actPart(el.getAttribute('data-a'),el);
});
document.addEventListener('keydown',function(e){
  if(!PANEL)return;
  var k=e.key;
  if(!started){if(k==='Enter'||k===' '){e.preventDefault();start();}return;}
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();go(1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(-1);}
  else if(k==='Home'){slide=0;render();}
  else if(k==='End'){slide=2;render();}
  else if(k==='f'||k==='F'){fs();}
  else if((k==='s'||k==='S')&&DEMO){simulate();}
});

if(PANEL){renderPanel();}
else{loadP();renderPart();}
})();

</script>
</body>
